name: Build RAKETA (Windows)

# Compile l'application desktop RAKETA (dossier raketa/) sur un runner Windows
# et publie l'installeur (.exe NSIS + .msi) en artifact et en release téléchargeable.

on:
  push:
    branches: [claude/raketa-download-manager]
    paths:
      - "raketa/**"
      - ".github/workflows/raketa-windows.yml"
  workflow_dispatch: {}

# Annule un build en cours quand un nouveau push arrive (évite le gaspillage).
concurrency:
  group: raketa-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: raketa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: raketa/src-tauri

      - name: Installer les dépendances front
        run: npm install

      - name: Compiler RAKETA (Tauri build)
        run: npm run tauri build
        env:
          # Numéro de build intégré à l'app (affiché dans Paramètres › Mises à jour).
          RAKETA_BUILD: ${{ github.run_number }}

      - name: Empaqueter l'extension navigateur
        # Zip de l'extension Chrome/Edge/Firefox, joint aux releases pour que
        # l'utilisateur l'installe (chargée « non empaquetée »).
        shell: pwsh
        run: Compress-Archive -Path browser-extension/* -DestinationPath raketa-extension.zip -Force

      - name: Empreinte SHA-256 de l'installeur
        # Calcule l'empreinte de l'installeur NSIS, publiée dans le corps de la
        # release ; l'app la vérifie avant de lancer la mise à jour (intégrité).
        id: hash
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $h = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          "setup_sha256=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SHA256($($exe.Name)) = $h"

      - name: Publier l'installeur en artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAKETA-Windows
          path: |
            raketa/src-tauri/target/release/bundle/nsis/*.exe
            raketa/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Mettre à jour la release « dernière version »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: raketa-latest
          name: RAKETA — dernière version (build ${{ github.run_number }})
          body: |
            ## RAKETA — build ${{ github.run_number }}

            Installeur Windows, compilé automatiquement.

            - `*-setup.exe` : installeur NSIS (recommandé)
            - `*.msi` : installeur MSI

            > Compare avec la version affichée dans **Paramètres › Mises à jour**
            > de ton app. Si ton build est inférieur à **${{ github.run_number }}**,
            > réinstalle ce `.exe`.

            Commit : ${{ github.sha }}
          prerelease: true
          files: |
            raketa/src-tauri/target/release/bundle/nsis/*.exe
            raketa/src-tauri/target/release/bundle/msi/*.msi
            raketa/raketa-extension.zip

      - name: Initialiser le dépôt public s'il est vide
        # GitHub refuse de publier une release dans un dépôt SANS commit
        # (« Repository is empty ») : l'asset est bien envoyé mais la release
        # reste à l'état brouillon, donc invisible pour `releases/latest` — d'où
        # un faux « Vous êtes à jour » côté app. On crée donc un README la
        # première fois ; ensuite le fichier existe et l'étape ne fait rien.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASES_TOKEN absent : étape ignorée."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vagnondily/raketa-releases/contents/README.md)
          echo "contents/README.md -> HTTP $code"
          if [ "$code" = "404" ]; then
            echo "Dépôt public vide : création du README initial."
            content=$(printf '# RAKETA releases\n\nWindows installers published automatically by CI.\nManaged by the RAKETA app (Settings > Updates).\n' | base64 | tr -d '\n')
            curl -s -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vagnondily/raketa-releases/contents/README.md \
              -d "{\"message\":\"chore: initialize releases repository\",\"content\":\"$content\"}" \
              -o /dev/null -w "create README -> HTTP %{http_code}\n"
          fi

      - name: Publier sur le dépôt public (mise à jour auto)
        # Requiert le secret RELEASES_TOKEN (PAT avec accès au dépôt
        # vagnondily/raketa-releases). Tolérant : n'échoue pas le build s'il manque.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: vagnondily/raketa-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: b${{ github.run_number }}
          name: RAKETA build ${{ github.run_number }}
          body: |
            Installeur Windows de RAKETA — build ${{ github.run_number }}.

            Téléchargé et vérifié automatiquement par l'app (Paramètres › Mises à jour).

            SHA256-SETUP: ${{ steps.hash.outputs.setup_sha256 }}
          files: |
            raketa/src-tauri/target/release/bundle/nsis/*.exe
            raketa/src-tauri/target/release/bundle/msi/*.msi
            raketa/raketa-extension.zip
