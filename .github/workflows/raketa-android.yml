name: Build RAKETA (Android)

# Compile l'application mobile RAKETA (Tauri 2 Android) et publie l'APK.
# Branche dédiée : l'app Windows (raketa-windows.yml) n'est pas affectée.

on:
  push:
    branches: [claude/raketa-android]
    paths:
      - "raketa/**"
      - ".github/workflows/raketa-android.yml"
  workflow_dispatch: {}

concurrency:
  group: raketa-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raketa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust (stable) + cibles Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: raketa/src-tauri

      - name: Android SDK + NDK (licences acceptées)
        # Le runner ubuntu-latest a déjà le SDK Android. On accepte les licences
        # (yes | …) et on installe NDK + plateforme + build-tools. Plus fiable que
        # l'action setup-android, qui restait bloquée sur l'acceptation.
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Installer les dépendances front
        run: npm install

      - name: Installer la CLI Tauri
        run: npm install -D @tauri-apps/cli@^2

      - name: Initialiser le projet Android (gen/android)
        env:
          RAKETA_BUILD: ${{ github.run_number }}
        run: npx tauri android init --ci

      - name: Compiler l'APK (debug)
        env:
          RAKETA_BUILD: ${{ github.run_number }}
        run: npx tauri android build --debug --apk

      - name: Publier l'APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAKETA-Android
          path: raketa/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Ne s'exécute QUE si le build ci-dessus a réussi (« si l'APK est bon ») :
      # publie l'APK dans le MÊME dépôt que les installeurs Windows
      # (vagnondily/raketa-releases), sur un tag Android dédié pour ne pas
      # entrer en conflit avec la numérotation « bN » des builds Windows.
      - name: Empreinte SHA-256 de l'APK
        id: apkhash
        shell: bash
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "apk=$apk"
          if [ -n "$apk" ]; then
            echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier l'APK sur le dépôt public (même dossier que Windows)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: vagnondily/raketa-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: android-latest
          name: RAKETA Android — dernière version (build ${{ github.run_number }})
          draft: false
          prerelease: false
          body: |
            APK Android de RAKETA — build ${{ github.run_number }} (compilé automatiquement).

            Installez l'APK sur votre téléphone (autorisez « sources inconnues » / « installer des applis inconnues » pour le gestionnaire de fichiers ou le navigateur).

            SHA256-APK: ${{ steps.apkhash.outputs.sha256 }}
          files: raketa/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
