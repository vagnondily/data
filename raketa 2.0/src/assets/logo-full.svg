<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RAKETA — Smart Service Androy">
  <defs>
    <linearGradient id="body" x1="210" y1="60" x2="210" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BC0F0"/>
      <stop offset="0.45" stop-color="#2FA4E7"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ring" x1="40" y1="40" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FA4E7"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="flame" x1="210" y1="330" x2="210" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF5B2B"/>
    </linearGradient>
    <linearGradient id="word" x1="470" y1="150" x2="1180" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BC0F0"/>
      <stop offset="0.55" stop-color="#2FA4E7"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="210" cy="210" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- ===== Emblème (échelle ~0.62 du mark, centré à x=210,y=210) ===== -->
  <g transform="translate(210 210) scale(0.6) translate(-320 -300)">
    <circle cx="320" cy="296" r="250" fill="url(#glow)"/>
    <circle cx="320" cy="300" r="222" fill="none" stroke="url(#ring)" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="1020 350" transform="rotate(118 320 300)" opacity="0.55"/>
    <g opacity="0.5" stroke="#2FA4E7" stroke-linecap="round">
      <line x1="150" y1="250" x2="214" y2="250" stroke-width="12"/>
      <line x1="132" y1="300" x2="206" y2="300" stroke-width="14"/>
      <line x1="150" y1="350" x2="214" y2="350" stroke-width="12"/>
    </g>
    <g filter="url(#soft)">
      <path d="M292 440 L348 440 C346 508 334 548 320 584 C306 548 294 508 292 440 Z" fill="url(#flame)"/>
    </g>
    <path d="M305 442 L335 442 C334 496 328 524 320 548 C312 524 306 496 305 442 Z" fill="#FFE39B"/>
    <path d="M266 404 L230 476 L266 452 Z" fill="#1d7bb3"/>
    <path d="M374 404 L410 476 L374 452 Z" fill="#b9760a"/>
    <path d="M250 356 q-54 2 -56 -50 q-1 -34 23 -34" fill="none" stroke="url(#body)" stroke-width="34" stroke-linecap="round"/>
    <path d="M390 356 q54 2 56 -50 q1 -34 -23 -34" fill="none" stroke="url(#body)" stroke-width="34" stroke-linecap="round"/>
    <path d="M320 86 C 374 150, 400 242, 392 322 C 388 382, 384 414, 372 444 L 268 444 C 256 414, 252 382, 248 322 C 240 242, 266 150, 320 86 Z" fill="url(#body)"/>
    <circle cx="320" cy="252" r="32" fill="#0a0b0d"/>
    <circle cx="320" cy="252" r="32" fill="none" stroke="#9FE0FF" stroke-width="7"/>
    <circle cx="330" cy="242" r="8" fill="#9FE0FF" opacity="0.8"/>
  </g>

  <!-- ===== Texte ===== -->
  <text x="458" y="232" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="150"
        font-weight="800" letter-spacing="14" fill="url(#word)">RAKETA</text>
  <text x="464" y="292" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="30"
        font-weight="600" letter-spacing="16" fill="#9aa0a8">SMART SERVICE ANDROY</text>
</svg>
