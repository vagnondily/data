[package]
name = "raketa-torrent"
version = "0.1.0"
edition = "2021"
description = "Moteur BitTorrent de RAKETA (magnets + .torrent) basé sur librqbit."
license = "MIT"

[dependencies]
librqbit = "9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
