[package]
name = "raketa-torrent"
version = "0.1.0"
edition = "2021"
description = "Moteur BitTorrent de RAKETA (magnets + .torrent) basé sur librqbit."
license = "MIT"

[dependencies]
# rust-tls (rustls + ring) au lieu de default-tls (OpenSSL) : OpenSSL ne se
# cross-compile pas facilement pour Android, et rustls fonctionne aussi bien
# sur bureau. Aligné avec reqwest (rustls) côté src-tauri.
librqbit = { version = "9", default-features = false, features = ["rust-tls", "http-api-client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
