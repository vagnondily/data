<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RAKETA">
  <defs>
    <linearGradient id="body" x1="320" y1="88" x2="320" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BC0F0"/>
      <stop offset="0.45" stop-color="#2FA4E7"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ring" x1="100" y1="100" x2="540" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FA4E7"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="flame" x1="320" y1="440" x2="320" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF5B2B"/>
    </linearGradient>
    <radialGradient id="glow" cx="320" cy="300" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Badge sombre -->
  <rect x="0" y="0" width="640" height="640" rx="150" fill="#0a0b0d"/>
  <rect x="6" y="6" width="628" height="628" rx="146" fill="none" stroke="#23262d" stroke-width="2"/>

  <!-- Halo -->
  <circle cx="320" cy="296" r="250" fill="url(#glow)"/>

  <!-- Orbite / arc signal (clin d'œil au logo d'origine) -->
  <circle cx="320" cy="300" r="222" fill="none" stroke="url(#ring)" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="1020 350" transform="rotate(118 320 300)" opacity="0.55"/>

  <!-- Traînées de vitesse -->
  <g opacity="0.5" stroke="#2FA4E7" stroke-linecap="round">
    <line x1="150" y1="250" x2="214" y2="250" stroke-width="12"/>
    <line x1="132" y1="300" x2="206" y2="300" stroke-width="14"/>
    <line x1="150" y1="350" x2="214" y2="350" stroke-width="12"/>
  </g>

  <!-- Propulsion -->
  <g filter="url(#soft)">
    <path d="M292 440 L348 440 C346 508 334 548 320 584 C306 548 294 508 292 440 Z" fill="url(#flame)"/>
  </g>
  <path d="M305 442 L335 442 C334 496 328 524 320 548 C312 524 306 496 305 442 Z" fill="#FFE39B"/>

  <!-- Ailerons -->
  <path d="M266 404 L230 476 L266 452 Z" fill="#1d7bb3"/>
  <path d="M374 404 L410 476 L374 452 Z" fill="#b9760a"/>

  <!-- Bras de cactus (saguaro) = fusée + raketa -->
  <path d="M250 356 q-54 2 -56 -50 q-1 -34 23 -34" fill="none" stroke="url(#body)" stroke-width="34" stroke-linecap="round"/>
  <path d="M390 356 q54 2 56 -50 q1 -34 -23 -34" fill="none" stroke="url(#body)" stroke-width="34" stroke-linecap="round"/>

  <!-- Corps de la fusée-cactus -->
  <path d="M320 86
           C 374 150, 400 242, 392 322
           C 388 382, 384 414, 372 444
           L 268 444
           C 256 414, 252 382, 248 322
           C 240 242, 266 150, 320 86 Z" fill="url(#body)"/>

  <!-- Hublot -->
  <circle cx="320" cy="252" r="32" fill="#0a0b0d"/>
  <circle cx="320" cy="252" r="32" fill="none" stroke="#9FE0FF" stroke-width="7"/>
  <circle cx="330" cy="242" r="8" fill="#9FE0FF" opacity="0.8"/>
</svg>
